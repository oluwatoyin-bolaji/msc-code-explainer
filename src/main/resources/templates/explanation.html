<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Explanation Result</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row">
        <div class="col-md-8 offset-md-2">
            <h1 class="mb-4">Explanation</h1>

            <h5>Your Code:</h5>
            <pre class="bg-dark text-white p-3 rounded" th:text="${submittedCode}"></pre>

            <h5 class="mt-4">AI Explanation:</h5>
            <div class="alert alert-info" th:text="${explanation}"></div>

            <a href="/" class="btn btn-secondary mt-3">Try Another</a>
        </div>
    </div>
</div>

</body>
</html>
